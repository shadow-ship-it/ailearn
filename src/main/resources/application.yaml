spring:
  application:
    name: rag_ai
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  ai:
    openai:
      # 阿里云百炼 DashScope 的 API Key，建议通过环境变量 DASHSCOPE_API_KEY 注入
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      embedding:
        # DashScope 的 OpenAI 兼容端点
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # Qwen 文本向量模型
        model: text-embedding-v4
        # text-embedding-v4 支持 2048 / 1536 / 1024 / 768 / 512
        dimensions: 1024
  data:
    mongodb:
      # 文档元数据与提取内容库
      uri: mongodb://localhost:27017/rag_ai

minio:
  # MinIO 服务地址
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: Admin@123456
  # 文档存储桶（不存在时自动创建）
  bucket: documents
  region: us-east-1

rag:
  ingest:
    # 章节内二次切分：单个分块的目标 token 数
    chunk-size: 800
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    keep-separator: true
    # 章节正文超过该字符数才做二次切分
    max-chapter-chars: 1500
    # DashScope 单次 embedding 请求的文本条数上限为 10
    embedding-batch-size: 10
    # 是否合并 PDF 换行导致的软换行
    merge-soft-line-breaks: true
    # 标题行的最大长度，超过则不当作章节标题
    max-heading-length: 60

server:
  port: 8082
